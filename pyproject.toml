[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "matchmaker"
version = "0.1.0"
description = "Generate positive and negative test inputs from regular expressions."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Masudul Hasan" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
# Matchmaker itself needs only the standard library plus `regex`, which provides
# the intended parsing, recursion, validation and timeout behavior.
dependencies = ["regex>=2024.11.6"]

[project.optional-dependencies]
# Optional PNG rendering of graphs (also needs the Graphviz `dot` binary).
viz = ["graphviz>=0.20"]
# Exact versions used for the reported evaluation. External non-Python
# generators (Java, Node.js, EGRET, MutRex) are prepared by
# setup_coverage_benchmarks.sh.
benchmarks = [
    "coverage==7.14.3",
    "django==6.0.6",
    "email-validator==2.3.0",
    "exrex==0.12.0",
    "graphviz==0.21",
    "marshmallow==4.3.0",
    "matplotlib==3.11.0",
    "numpy==2.5.0",
    "pandas==3.0.3",
    "pydantic==2.13.4",
    "python-dateutil==2.9.0.post0",
    "regex==2026.1.15",
    "seaborn==0.13.2",
    "tqdm==4.68.3",
    "validators==0.36.0",
    "xeger==0.4.0",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The repository root goes on sys.path so tests can import benchmarks/ and
# ablation/ helpers; the matchmaker package itself comes from the install.
pythonpath = ["."]
testpaths = ["tests", "ablation/tests"]
